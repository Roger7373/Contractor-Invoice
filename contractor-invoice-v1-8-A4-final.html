<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#642337"><link rel="manifest" href="manifest.json"><title>Contractor Invoice</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2d2530;background:#f8f5f6}*{box-sizing:border-box}body{margin:0;padding-bottom:82px}header{background:#642337;color:white;padding:22px 18px}h1{font-size:23px;margin:3px 0}h2{font-size:19px}main{max-width:820px;margin:auto;padding:16px}.card{background:white;border:1px solid #e9dfe3;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,select,textarea{width:100%;border:1px solid #d6c9ce;border-radius:8px;padding:11px;font:inherit;background:white}label{display:block;font-size:12px;color:#6d5d65;margin:10px 0 4px}button{background:#642337;color:white;border:0;border-radius:9px;padding:11px 13px;font:inherit;cursor:pointer}button.alt{background:#f1e8ec;color:#642337}button.danger{background:#a32637}button.small{padding:6px 9px;font-size:12px}nav{position:fixed;bottom:0;background:white;border-top:1px solid #ddd;width:100%;display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:3}nav button{background:none;color:#642337;font-size:12px;padding:8px 3px}.muted{color:#766d72;font-size:13px}.total{background:#642337;color:white;border-radius:10px;padding:15px;font-weight:700;font-size:20px}.item{border-top:1px solid #eee;padding:12px 0}.hidden{display:none}canvas{width:100%;height:150px;border:1px dashed #bbb;touch-action:none;background:white}.pill{background:#f1e8ec;color:#642337;border-radius:20px;padding:5px 9px;font-size:12px}@media print{header,nav,.no-print,button{display:none!important}body{padding /* v1.4: A4 print layout; preserve mobile screen preview */
@page{size:A4 portrait;margin:10mm}
@media print{
 html,body{width:auto!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important}
 header,nav,.no-print{display:none!important}
 main#app{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important}
 #paper{display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;font-size:12px!important;line-height:1.4!important}

/* V1.7 typography: invoice only, both screen and A4 PDF */
#paper .invoice-company,#pdf-paper .invoice-company{font-size:26px!important;line-height:1.2!important;font-weight:800!important;letter-spacing:.15px}
#paper .invoice-items,#pdf-paper .invoice-items{font-size:15px!important;line-height:1.35!important}

#paper .invoice-items small,#pdf-paper .invoice-items small{font-size:12px!important}

/* V1.8 fixed A4 invoice sheets, same on screen and in exported PDF */
#paper{padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important}
.v18-page{width:794px;height:1123px;background:#fff;color:#25232a;box-sizing:border-box;padding:39px 40px 38px;position:relative;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.36;overflow:hidden;margin:0 auto 18px;box-shadow:0 2px 12px #0001}
.v18-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #78243e;padding-bottom:13px;min-height:150px}
.v18-brand{width:485px;max-width:70%}.v18-logo{width:325px;height:91px;object-fit:contain;object-position:left center;display:block;margin:-7px 0 4px -3px}.v18-contact{font-size:12px;line-height:1.35;white-space:pre-line}
.v18-meta{text-align:right;min-width:150px;font-size:13px;line-height:1.6}.v18-meta strong{font-size:23px;color:#79243f;display:block;line-height:1.2;margin:12px 0 5px}
.v18-client{display:flex;gap:35px;margin:16px 0 19px;min-height:61px}.v18-client>div{flex:1}.v18-label{font-size:15px;color:#79243f;font-weight:bold;margin-bottom:5px}.v18-client-value{font-size:16px;white-space:pre-line}

.v18-last{position:absolute;bottom:38px;left:40px;right:40px}.v18-sums{font-size:13px;text-align:right;line-height:1.65;margin-bottom:8px}.v18-grand{background:#76223d;color:#fff;text-align:right;padding:11px 13px;border-radius:5px;font-size:18px;font-weight:700;margin-bottom:19px}
.v18-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.v18-bank{font-size:12px;line-height:1.5;white-space:pre-line}.v18-bank b{font-size:13px;color:#76223d}.v18-sign{text-align:center;width:230px;flex:none;font-size:11px}.v18-sign .stamp-wrap{width:210px;height:98px;margin:0 auto;position:relative}.v18-sign .stamp-signature{top:35%}

 const heights=x.items.map(i=>{let t=String(i.description||'')+' '+String(i.size||'');return 34+Math.max(0,Math.ceil(t.length/49)-1)*18+Math.max(0,(t.match(/\n/g)||[]).length)*18});
 x.items.forEach((it,index)=>{let h=heights[index],limit=groups.length?maxOther:maxFirst;
  if(rows.length && (used+h>limit || rows.length>=15)){groups.push(rows);rows=[];used=0}
  rows.push({it,index});used+=h;
 });
 if(rows.length||!groups.length)groups.push(rows);
 // Ensure the final page has enough reserved height for totals, bank and stamp.
 let last=groups[groups.length-1],lastHeight=last.reduce((sum,r)=>sum+heights[r.index],0);
 let limit=(groups.length===1?maxFirst:maxOther)-lastReserve;
 while(last.length>1 && lastHeight>limit){let moved=last.pop();lastHeight-=heights[moved.index];if(groups.length===1){groups.push([moved]);last=groups[1];lastHeight=heights[moved.index];limit=maxOther-lastReserve;break}else{groups.push([moved]);last=groups[groups.length-1];lastHeight=heights[moved.index];limit=maxOther-lastReserve;break}}
 // For large final groups, split before settlement without losing any item.
 if(groups.length>1){let g=groups[groups.length-1],h=g.reduce((n,r)=>n+heights[r.index],0);if(h>maxOther-lastReserve){let tail=[];while(g.length>1&&h>maxOther-lastReserve){let r=g.pop();tail.unshift(r);h-=heights[r.index]}groups.push(tail)}}
 return groups;
}
function invoiceSheet(x,s,rows,p,totalPages){let last=p===totalPages-1;
 let header=`<div class="v18-header"><div class="v18-brand"><img class="v18-logo" src="${V18_LOGO}" alt="CHUN TECK ENTERPRISE"><div class="v18-contact">${esc(s.address)}<br>${esc(s.phone)}</div></div><div class="v18-meta"><strong>INVOICE</strong><b>${esc(x.no)}</b><br>${esc(x.date)}<br>Page ${p+1} of ${totalPages}</div></div>`;
 let client=p===0?`<div class="v18-client"><div><div class="v18-label">BILL TO</div><div class="v18-client-value">${esc(x.customer)}</div></div><div><div class="v18-label">PROJECT</div><div class="v18-client-value">${esc(x.project)}${x.site?'<br>'+esc(x.site):''}</div></div></div>`:'<div style="height:16px"></div>';
 let items=`<table class="v18-table"><colgroup><col style="width:7%"><col style="width:48%"><col style="width:11%"><col style="width:16%"><col style="width:18%"></colgroup><thead><tr><th>No</th><th style="text-align:left">Description</th><th>Qty</th><th>Rate (RM)</th><th>Amount (RM)</th></tr></thead><tbody>${rows.map(({it,index})=>`<tr><td class="num">${index+1}</td><td class="desc">${esc(it.description)}${it.size?`<small>${esc(it.size)}</small>`:''}</td><td class="num">${esc(it.qty)} ${esc(it.unit)}</td><td class="money">${Number(it.rate).toFixed(2)}</td><td class="money">${(Number(it.qty)*Number(it.rate)).toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
 let footer=last?`<div class="v18-last"><div class="v18-sums">Subtotal: ${rm(x.items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.rate||0),0))}<br>Discount: ${rm(x.discount)}</div><div class="v18-grand">TOTAL AMOUNT: ${rm(total(x))}</div><div class="v18-foot"><div class="v18-bank"><b>BANK DETAILS</b><br>${esc(s.bank)}<br>Account No: ${esc(s.account)}<br>Account Holder: ${esc(s.holder)}</div><div class="v18-sign"><div class="stamp-wrap">${s.chop?`<img class="stamp-chop" src="${s.chop}" alt="Company Chop">`:''}${s.signature?`<img class="stamp-signature" src="${s.signature}" alt="Signature">`:''}</div><div>Authorized Signature &amp; Company Chop</div></div></div></div>`:'';
 return `<section class="v18-page">${header}${client}${items}${footer}</section>`;
}
function showPreview(){let x=db.invoices.find(y=>y.id===preview);if(!x)return go('invoices');let s=db.settings,groups=invoicePages(x);
 app.innerHTML=`<div class="no-print card row"><b>${esc(x.no)} · ${x.draft?'草稿':'正式'} ${x.void?'（已作废）':''}</b><span><button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div><div id="paper">${groups.map((g,p)=>invoiceSheet(x,s,g,p,groups.length)).join('')}</div><div class="card no-print"><button onclick="exportInvoicePDF()">导出 PDF</button> <button class="alt" onclick="printInvoice()">打印</button> <button class="alt" onclick="shareInvoice()">分享</button> <button class="alt" onclick="historyView('${x.id}')">历史版本 (${x.versions?.length||0})</button> <button class="danger" onclick="voidInvoice('${x.id}')">作废</button><p class="muted">V1.8 自动 A4 分页，汇总和签名仅在最后一页。</p></div>`;
 // Scale A4 preview to fit phones without changing export/print sizes.
 let host=document.getElementById('paper');let apply=()=>{let w=Math.min(794,host.clientWidth);let scale=w/794;host.querySelectorAll('.v18-page').forEach(el=>{el.style.transformOrigin='top left';el.style.transform=`scale(${scale})`;el.style.marginLeft='0';el.style.marginBottom=(1123*(scale-1)+18)+'px'});host.style.width='100%'};apply();
}
let pdfLoading=null;
function loadPdfLibrary(){
 if(typeof window.html2canvas==='function' && window.jspdf?.jsPDF)return Promise.resolve();
 if(pdfLoading)return pdfLoading;
 const loadScript=(url,check)=>new Promise((resolve,reject)=>{
  if(check())return resolve();
  const script=document.createElement('script');script.src=url;
  script.onload=()=>check()?resolve():reject(Error('PDF library initialization failed'));
  script.onerror=()=>reject(Error('PDF library download failed; check internet connection'));
  document.head.appendChild(script);
 });
 pdfLoading=Promise.all([
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>typeof window.html2canvas==='function'),
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>typeof window.jspdf?.jsPDF==='function')
 ]).catch(e=>{pdfLoading=null;throw e});
 return pdfLoading;
}
async function buildInvoicePDF(){
 const x=db.invoices.find(y=>y.id===preview);if(!x)throw Error('请先打开 Invoice 预览');await loadPdfLibrary();
 const frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.style.cssText='position:fixed;left:0;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none;z-index:-1';document.body.appendChild(frame);
 try{const doc=frame.contentDocument;const css=document.querySelector('style').textContent;
 doc.open();doc.write('<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style><style>html,body{margin:0!important;padding:0!important;width:794px!important;background:white!important}.v18-page{width:794px!important;height:1123px!important;box-shadow:none!important;margin:0!important;transform:none!important}.v18-page .v18-last{bottom:38px!important;left:40px!important;right:40px!important}</style></head><body></body></html>');doc.close();
 const groups=invoicePages(x),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
 for(let i=0;i<groups.length;i++){doc.body.innerHTML=invoiceSheet(x,db.settings,groups[i],i,groups.length);let sheet=doc.querySelector('.v18-page');await Promise.all(Array.from(sheet.querySelectorAll('img')).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));if(doc.fonts?.ready)await doc.fonts.ready;
 const canvas=await window.html2canvas(sheet,{scale:1.7,backgroundColor:'#fff',useCORS:true,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1123});if(i)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',0,0,210,297);
 }
 return {blob:pdf.output('blob'),filename:x.no+'.pdf'};
 }finally{frame.remove()}
}
async function exportInvoicePDF(){
 const btn=document.querySelector('button[onclick="exportInvoicePDF()"]');
 if(btn){btn.disabled=true;btn.textContent='正在生成 PDF…'}
 try{
  const {blob,filename}=await buildInvoicePDF();
  const file=new File([blob],filename,{type:'application/pdf'});
  if(navigator.canShare?.({files:[file]})&&navigator.share){
   try{await navigator.share({files:[file],title:filename});return}catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){console.error(e);alert('PDF 导出失败：'+e.message+'。请在 Safari 中重试。')}
 finally{if(btn){btn.disabled=false;btn.textContent='导出 PDF'}}
}
async function printInvoice(){
 // Use the same PDF renderer for print, avoiding the separate iPhone print CSS path.
 try{
  const {blob}=await buildInvoicePDF();
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(e){alert('打开打印 PDF 失败：'+e.message)}
}
function shareInvoice(){alert('请先点击「导出 PDF / 打印」，在 iPhone 打印预览中打开分享菜单，存储 PDF 后分享到 WhatsApp。')}function voidInvoice(id){if(!confirm('确定作废此 Invoice？编号会保留。'))return;let x=db.invoices.find(y=>y.id===id);x.void=true;save();render()}function historyView(id){let x=db.invoices.find(y=>y.id===id);alert((x.versions||[]).map((y,i)=>`V${i+1} · ${y.archivedAt||y.date} · ${rm(total(y))}`).join('\n')||'目前没有历史版本')}
function rates(){app.innerHTML=`<div class="card"><h2>分类管理</h2><select id="catSel" onchange="rateRows()">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="row" style="margin-top:10px"><button class="small alt" onclick="addCategory()">＋ 分类</button><button class="small alt" onclick="renameCategory()">修改名称</button><button class="small danger" onclick="deleteCategory()">删除分类</button></div></div><div class="card"><h2>新增价格项目</h2>${field('项目名称','r_desc')}${field('Size','r_size')}${field('Unit','r_unit','m')}${field('Rate (RM)','r_rate','0','number')}<button onclick="addRateRow()">保存项目</button></div><div class="card"><h2>价格库</h2><div id="rateRows"></div></div>`;rateRows()}function rateRows(){let c=v('catSel');document.getElementById('rateRows').innerHTML=db.rates.map((x,i)=>({...x,i})).filter(x=>x.category===c).map(x=>`<div class="item row"><div><b>${esc(x.description)}</b><div class="muted">${esc(x.size)} · ${rm(x.rate)}/${esc(x.unit)}</div></div><span><button class="small alt" onclick="editRate(${x.i})">修改</button> <button class="small danger" onclick="delRate(${x.i})">删除</button></span></div>`).join('')||'<p class="muted">暂无项目</p>'}function addCategory(){let n=prompt('新分类名称');if(n?.trim()&&!db.categories.includes(n.trim())){db.categories.push(n.trim());save();rates()}}function renameCategory(){let c=v('catSel'),n=prompt('修改分类名称',c);if(!n?.trim()||n===c)return;db.categories=db.categories.map(x=>x===c?n:x);db.rates.forEach(x=>{if(x.category===c)x.category=n});save();rates()}function deleteCategory(){let c=v('catSel');if(!confirm(`删除 ${c}？该分类的价格项目也会删除，历史 Invoice 不受影响。`))return;db.categories=db.categories.filter(x=>x!==c);db.rates=db.rates.filter(x=>x.category!==c);save();rates()}function addRateRow(){if(!v('r_desc'))return alert('请填写项目名称');db.rates.push({category:v('catSel'),description:v('r_desc'),size:v('r_size'),unit:v('r_unit'),rate:Number(v('r_rate'))||0});save();rates()}function editRate(i){let x=db.rates[i],n=prompt('项目名称',x.description);if(n===null)return;x.description=n;x.size=prompt('Size',x.size)??x.size;x.unit=prompt('Unit',x.unit)??x.unit;x.rate=Number(prompt('Rate (RM)',x.rate)??x.rate);save();rates()}function delRate(i){if(confirm('删除此价格项目？')){db.rates.splice(i,1);save();rates()}}
function customers(){app.innerHTML=`<div class="card"><h2>新增客户</h2>${field('客户 / 公司名称','c_name')}${field('电话','c_phone')}${field('地址','c_address')}<button onclick="addCustomer()">保存客户</button></div>${db.customers.map((x,i)=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.address)}</div></div><span><button class="small alt" onclick="editCustomer(${i})">修改</button> <button class="small danger" onclick="deleteCustomer(${i})">删除</button></span></div>`).join('')}`}function addCustomer(){if(!v('c_name'))return;db.customers.push({name:v('c_name'),phone:v('c_phone'),address:v('c_address')});save();customers()}function editCustomer(i){let x=db.customers[i];x.name=prompt('客户名称',x.name)??x.name;x.phone=prompt('电话',x.phone)??x.phone;x.address=prompt('地址',x.address)??x.address;save();customers()}function deleteCustomer(i){if(confirm('删除客户？')){db.customers.splice(i,1);save();customers()}}
function settings(){let s=db.settings;app.innerHTML=`<div class="card"><h2>公司资料</h2>${field('Company Name','s_company',s.company)}<label>Address</label><textarea id="s_address">${esc(s.address)}</textarea>${field('Contact Number','s_phone',s.phone)}<h2>银行资料</h2>${field('Bank Name','s_bank',s.bank)}${field('Account Number','s_account',s.account)}${field('Account Holder','s_holder',s.holder)}<button onclick="saveSettings()">保存设置</button></div><div class="card"><h2>电子签名</h2><p class="muted">用手指在下方签名，保存后自动显示在新生成的 Invoice PDF 中。</p><canvas id="sign"></canvas><div class="row"><button class="alt" onclick="clearSign()">清除重签</button><button onclick="saveSign()">保存签名</button></div></div><div class="card"><h2>Company Chop 公司印章</h2><p class="muted">保留 CHUN TECK ENTERPRISE 旧式盖章质感及下方虚线。签名自动显示在公司名与虚线之间。</p><div style="max-width:310px;background:#fff;border:1px dashed #ddd;padding:12px"><img id="chopPreview" src="${s.chop||''}" style="width:100%;height:auto"></div><label>更换透明背景 PNG 印章</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadChop(event)"><button class="alt" onclick="resetChop()">恢复原始公司印章</button></div><div class="card"><h2>本机资料备份</h2><p class="muted">本机储存可能因清除 Safari 网站数据、卸载或换手机而丢失。请定期导出 JSON 备份。</p><button onclick="backup()">导出备份 JSON</button> <label>导入备份 JSON</label><input type="file" accept="application/json" onchange="restore(event)"></div><div class="card"><b>下一个 Invoice：${nextNo()}</b><p class="muted">永久连续编号，不包含年份。无税务、无付款状态、无 Remarks、无 Registration No.</p></div>`;setupCanvas()}function saveSettings(){for(let k of ['company','address','phone','bank','account','holder'])db.settings[k]=v('s_'+k);save();alert('已保存')}let canvas,ctx,down=false;function setupCanvas(){canvas=document.getElementById('sign');canvas.width=600;canvas.height=180;ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#273348';if(db.settings.signature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,600,180);im.src=db.settings.signature}const pos=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{down=true;signatureDirty=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};canvas.onpointerup=()=>down=false}function clearSign(){ctx.clearRect(0,0,600,180);signatureDirty=true}function saveSign(){db.settings.signature=canvas.toDataURL('image/png');save();alert('电子签名已保存')}function uploadChop(e){let f=e.target.files?.[0];if(!f)return;if(f.size>3000000)return alert('图片请小于 3MB');let r=new FileReader();r.onload=()=>{db.settings.chop=r.result;try{save();settings();alert('公司印章已保存')}catch(err){alert('储存空间不足，请使用较小的 PNG 图片')}};r.readAsDataURL(f)}function resetChop(){db.settings.chop=DEFAULT_CHOP;save();settings()}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contractor-invoice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.invoices)||!Array.isArray(d.categories)||!d.settings)throw Error('无效备份');if(confirm('导入会覆盖本机现有资料，继续吗？')){db=d;save();render()}}).catch(()=>alert('备份文件无效'))}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});save();render();
</script></body></html>
