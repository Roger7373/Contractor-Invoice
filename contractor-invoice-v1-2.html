<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#642337"><link rel="manifest" href="manifest.json"><title>Contractor Invoice</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2d2530;background:#f8f5f6}*{box-sizing:border-box}body{margin:0;padding-bottom:82px}header{background:#642337;color:white;padding:22px 18px}h1{font-size:23px;margin:3px 0}h2{font-size:19px}main{max-width:820px;margin:auto;padding:16px}.card{background:white;border:1px solid #e9dfe3;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,select,textarea{width:100%;border:1px solid #d6c9ce;border-radius:8px;padding:11px;font:inherit;background:white}label{display:block;font-size:12px;color:#6d5d65;margin:10px 0 4px}button{background:#642337;color:white;border:0;border-radius:9px;padding:11px 13px;font:inherit;cursor:pointer}button.alt{background:#f1e8ec;color:#642337}button.danger{background:#a32637}button.small{padding:6px 9px;font-size:12px}nav{position:fixed;bottom:0;background:white;border-top:1px solid #ddd;width:100%;display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:3}nav button{background:none;color:#642337;font-size:12px;padding:8px 3px}.muted{color:#766d72;font-size:13px}.total{background:#642337;color:white;border-radius:10px;padding:15px;font-weight:700;font-size:20px}.item{border-top:1px solid #eee;padding:12px 0}.hidden{display:none}canvas{width:100%;height:150px;border:1px dashed #bbb;touch-action:none;background:white}.pill{background:#f1e8ec;color:#642337;border-radius:20px;padding:5px 9px;font-size:12px}@media print{header,nav,.no-print,button{display:none!important}body{padding:0;background:white}main{padding:0}.card{box-shadow:none;border:0}.print-sheet{display:block!important}.screen{display:none!important}}.print-sheet{display:none}@media screen{.print-sheet.show{display:block}}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #ddd;text-align:left;padding:7px 4px}th{background:#642337;color:white}.invoice-head{display:flex;justify-content:space-between;border-bottom:3px solid #642337;padding-bottom:15px}.right{text-align:right}</style></head><body><header><small>CONTRACTOR INVOICE</small><h1 id="heading">首页</h1></header><main id="app"></main><nav id="nav"></nav><script>
const KEY='contractor_invoice_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{settings:{company:'',address:'',phone:'',bank:'',account:'',holder:'',signature:''},customers:[],categories:['A Cold Water PPR','B Sanitary / Soil / Waste','C Sanitary Ware Labour','D Tank & Pump','E Civil Works','F Contractor Add-On','G Ceiling Works','H Tiling Works','I Painting Works','J Partition Works','K Other Construction Works'],rates:[{category:'B Sanitary / Soil / Waste',description:'UPVC White Pipe',size:'32mm',unit:'m',rate:22},{category:'B Sanitary / Soil / Waste',description:'UPVC White Pipe',size:'40mm',unit:'m',rate:28},{category:'B Sanitary / Soil / Waste',description:'UPVC White Pipe',size:'50mm',unit:'m',rate:38},{category:'B Sanitary / Soil / Waste',description:'UPVC White Pipe',size:'100mm',unit:'m',rate:68},{category:'B Sanitary / Soil / Waste',description:'UPVC Brown Pipe',size:'100mm',unit:'m',rate:88}],invoices:[],next:1};db.next=db.next||1;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let page='home',draft=null,editing=null,preview=null,signatureDirty=false;const app=document.getElementById('app');const nav=document.getElementById('nav');const field=(label,id,value='',type='text')=>`<label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;const v=id=>document.getElementById(id)?.value||'';function go(p){page=p;render()}function render(){document.getElementById('heading').textContent=({home:'首页',invoices:'Invoice',rates:'工程价格库',customers:'客户管理',settings:'设置',editor:'编辑 Invoice',preview:'Invoice 预览'})[page];nav.innerHTML=['home','invoices','rates','customers','settings'].map((p,i)=>`<button onclick="go('${p}')">${['⌂ 首页','▤ Invoice','▦ 价格库','♙ 客户','⚙ 设置'][i]}</button>`).join('');({home:home,invoices:invoices,rates:rates,customers:customers,settings:settings,editor:editor,preview:showPreview})[page]();}function home(){let docs=db.invoices.filter(x=>!x.void),month=new Date().toISOString().slice(0,7),m=docs.filter(x=>x.date.startsWith(month));app.innerHTML=`<div class="grid"><div class="card"><div class="muted">本月 Invoice 总额</div><h2>${rm(m.reduce((s,x)=>s+total(x),0))}</h2></div><div class="card"><div class="muted">本月开单数量</div><h2>${m.length}</h2></div></div><button onclick="newInvoice()">＋ 创建 Invoice</button><h2>最近单据</h2>${docs.slice(-5).reverse().map(x=>`<div class="card row"><div><b>${esc(x.no)}</b><div class="muted">${esc(x.customer)} · ${esc(x.date)}</div></div><button class="alt" onclick="openPreview('${x.id}')">${rm(total(x))}</button></div>`).join('')||'<div class="card muted">还没有 Invoice</div>'}`}
function invoices(){app.innerHTML=`<button onclick="newInvoice()">＋ 新建 Invoice</button><div class="card"><input id="find" placeholder="搜索编号、客户或工程" oninput="invoiceRows()"></div><div id="invoiceRows"></div>`;invoiceRows()}function invoiceRows(){let q=v('find').toLowerCase();document.getElementById('invoiceRows').innerHTML=db.invoices.slice().reverse().filter(x=>(x.no+x.customer+x.project).toLowerCase().includes(q)).map(x=>`<div class="card"><div class="row"><b>${esc(x.no)}</b><span class="pill">${x.void?'已作废':x.draft?'草稿':'正式'} · V${x.versions?.length||1}</span></div><p>${esc(x.customer||'未填写客户')}<br><span class="muted">${esc(x.project||'')} · ${esc(x.date)}</span></p><div class="row"><b>${rm(total(x))}</b><span><button class="small alt" onclick="openPreview('${x.id}')">查看</button> <button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div></div>`).join('')||'<div class="card muted">没有单据</div>'}
function total(x){return Math.max(0,Math.round((x.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.rate||0),0)*100)/100-Number(x.discount||0))}function nextNo(){return 'INV-'+String(db.next).padStart(4,'0')}function newInvoice(){editing=null;draft={id:uid(),no:nextNo(),date:new Date().toLocaleDateString('en-CA'),customer:'',project:'',site:'',discount:0,items:[],draft:true,versions:[]};go('editor')}function editInvoice(id){editing=id;draft=structuredClone(db.invoices.find(x=>x.id===id));go('editor')}function duplicate(id){editing=null;draft=structuredClone(db.invoices.find(x=>x.id===id));draft.id=uid();draft.no=nextNo();draft.draft=true;draft.void=false;draft.versions=[];go('editor')}function editor(){app.innerHTML=`<div class="card"><div class="row"><b>${esc(draft.no)}</b><span class="pill">${editing?'修改单据':'新单据'}</span></div>${field('Invoice Date','d_date',draft.date,'date')}<label>客户（可直接输入）</label><input id="d_customer" list="clients" value="${esc(draft.customer)}"><datalist id="clients">${db.customers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>${field('Project / 工程名称','d_project',draft.project)}${field('Site / 工地地址','d_site',draft.site)}</div><div class="card"><div class="row"><b>工程项目</b><button class="small" type="button" id="manualAddBtn">＋ 手动添加</button></div><label>从价格库选择</label><select id="ratePick"><option value="">选择工程项目</option>${db.rates.map((x,i)=>`<option value="${i}">${esc(x.description)} ${esc(x.size)} · ${rm(x.rate)}/${esc(x.unit)}</option>`).join('')}</select><button class="alt" onclick="addRate()">加入价格库项目</button><div id="itemRows"></div></div><div class="card">${field('Discount (RM)','d_discount',draft.discount,'number')}<p class="total" id="d_total"></p><div class="row"><button class="alt" onclick="saveInvoice(true)">保存草稿</button><button onclick="saveInvoice(false)">保存正式 Invoice</button></div></div>`;itemRows();document.getElementById('manualAddBtn').addEventListener('click',addItem)}
function sync(){draft.date=v('d_date');draft.customer=v('d_customer');draft.project=v('d_project');draft.site=v('d_site');draft.discount=Math.max(0,Number(v('d_discount'))||0);draft.items.forEach((x,i)=>{x.description=v('desc'+i);x.size=v('size'+i);x.unit=v('unit'+i);x.qty=Math.max(0,Number(v('qty'+i))||0);x.rate=Math.max(0,Number(v('rate'+i))||0)});}function itemRows(){document.getElementById('itemRows').innerHTML=draft.items.map((x,i)=>`<div class="item"><div class="row"><b>Item ${i+1}</b><span><button class="small alt" onclick="moveItem(${i},-1)">↑</button> <button class="small alt" onclick="moveItem(${i},1)">↓</button> <button class="small danger" onclick="removeItem(${i})">删除</button></span></div>${field('Description','desc'+i,x.description)}<div class="grid">${field('Size','size'+i,x.size)}${field('Unit','unit'+i,x.unit)}${field('Qty','qty'+i,x.qty,'number')}${field('Rate (RM)','rate'+i,x.rate,'number')}</div></div>`).join('');document.getElementById('itemRows').querySelectorAll('input').forEach(e=>e.addEventListener('input',()=>{sync();document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))}));document.getElementById('d_discount').oninput=()=>{sync();document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))};document.getElementById('d_total').textContent='TOTAL '+rm(total(draft))}function addItem(){try{if(!draft||!Array.isArray(draft.items)){alert('请先打开 Invoice 编辑页面');return}if(document.getElementById('d_date'))sync();draft.items.push({description:'',size:'',unit:'Lot',qty:1,rate:0});itemRows();let el=document.getElementById('desc'+(draft.items.length-1));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus({preventScroll:true})}}catch(err){console.error(err);alert('手动添加错误：'+(err.message||err))}}function addRate(){sync();let i=v('ratePick');if(i==='')return;let x=db.rates[Number(i)];draft.items.push({...x,qty:1,source:JSON.stringify({category:x.category,description:x.description,size:x.size,unit:x.unit})});itemRows()}function removeItem(i){sync();draft.items.splice(i,1);itemRows()}function moveItem(i,d){sync();let j=i+d;if(j<0||j>=draft.items.length)return;[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];itemRows()}
function saveInvoice(isDraft){sync();if(!draft.customer.trim()){alert('请填写客户名称');return}if(!draft.items.length){alert('请至少添加一个项目');return}for(let x of draft.items){if(x.source){let k=JSON.parse(x.source),r=db.rates.find(y=>y.category===k.category&&y.description===k.description&&y.size===k.size&&y.unit===k.unit);if(r&&Number(r.rate)!==Number(x.rate)&&confirm(`${x.description} ${x.size} 单价已改为 RM ${x.rate}。是否同时更新工程价格库？`))r.rate=x.rate}}draft.draft=isDraft;let old=db.invoices.find(x=>x.id===draft.id);if(old){draft.versions=old.versions||[];draft.versions.push({...structuredClone(old),versions:undefined,archivedAt:new Date().toISOString()});db.invoices=db.invoices.map(x=>x.id===draft.id?structuredClone(draft):x)}else{draft.no=nextNo();db.next++;db.invoices.push(structuredClone(draft))}save();preview=draft.id;go('preview')}
function openPreview(id){preview=id;go('preview')}function showPreview(){let x=db.invoices.find(y=>y.id===preview);if(!x)return go('invoices');let s=db.settings;app.innerHTML=`<div class="no-print card row"><b>${esc(x.no)} · ${x.draft?'草稿':'正式'} ${x.void?'（已作废）':''}</b><span><button class="small alt" onclick="editInvoice('${x.id}')">编辑</button> <button class="small alt" onclick="duplicate('${x.id}')">复制</button></span></div><div class="card" id="paper"><div class="invoice-head"><div><h2 style="color:#642337;margin:0">${esc(s.company||'YOUR COMPANY NAME')}</h2><small>${esc(s.address).replace(/\n/g,'<br>')}<br>${esc(s.phone)}</small></div><div class="right"><h1 style="color:#642337">INVOICE</h1><b>${esc(x.no)}</b><br>${esc(x.date)}</div></div><p><b>BILL TO</b><br>${esc(x.customer)}</p><p><b>PROJECT</b><br>${esc(x.project)}<br>${esc(x.site)}</p><table><thead><tr><th>No</th><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${x.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.description)}<br><small>${esc(i.size)}</small></td><td>${esc(i.qty)} ${esc(i.unit)}</td><td>${Number(i.rate).toFixed(2)}</td><td>${(i.qty*i.rate).toFixed(2)}</td></tr>`).join('')}</tbody></table><p class="right">Subtotal: ${rm(x.items.reduce((a,i)=>a+i.qty*i.rate,0))}<br>Discount: ${rm(x.discount)}</p><div class="total right">TOTAL AMOUNT: ${rm(total(x))}</div><p><b>BANK DETAILS</b><br>${esc(s.bank)}<br>Account No: ${esc(s.account)}<br>Account Holder: ${esc(s.holder)}</p><div class="right" style="margin-top:35px">${s.signature?`<img src="${s.signature}" style="width:180px;max-height:90px;object-fit:contain">`:'<div style="height:75px"></div>'}<br>Authorized Signature</div></div><div class="card no-print"><button onclick="exportInvoicePDF()">导出 PDF</button> <button class="alt" onclick="printInvoice()">打印</button> <button class="alt" onclick="shareInvoice()">分享</button> <button class="alt" onclick="historyView('${x.id}')">历史版本 (${x.versions?.length||0})</button> <button class="danger" onclick="voidInvoice('${x.id}')">作废</button><p class="muted">导出 PDF 会生成文件；打印会打开系统打印界面。若安装版无法打印，请在 Safari 浏览器中打开 App。</p></div>`}
let pdfLoading=null;
function loadPdfLibrary(){
 if(window.html2pdf)return Promise.resolve();
 if(pdfLoading)return pdfLoading;
 pdfLoading=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
  script.onload=()=>window.html2pdf?resolve():reject(Error('PDF library unavailable'));
  script.onerror=()=>reject(Error('PDF library download failed'));
  document.head.appendChild(script);
 }).catch(e=>{pdfLoading=null;throw e});
 return pdfLoading;
}
async function exportInvoicePDF(){
 const paper=document.getElementById('paper');
 const x=db.invoices.find(y=>y.id===preview);
 if(!paper||!x)return alert('请先打开 Invoice 预览');
 const btn=document.querySelector('button[onclick="exportInvoicePDF()"]');
 if(btn){btn.disabled=true;btn.textContent='正在生成 PDF…'}
 try{
  await loadPdfLibrary();
  const opts={margin:8,filename:x.no+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};
  const blob=await window.html2pdf().set(opts).from(paper).outputPdf('blob');
  const file=new File([blob],x.no+'.pdf',{type:'application/pdf'});
  if(navigator.canShare?.({files:[file]})&&navigator.share){
   try{await navigator.share({files:[file],title:x.no});return}catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=x.no+'.pdf';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){alert('PDF 导出失败：'+e.message+'。请确认网络连接，或在 Safari 打开 App 后重试。')}
 finally{if(btn){btn.disabled=false;btn.textContent='导出 PDF'}}
}
function printInvoice(){
 const paper=document.getElementById('paper');
 if(!paper)return alert('请先打开 Invoice 预览');
 try{window.print()}catch(e){alert('无法启动打印。请在 Safari 浏览器打开 App 后重试。')}
}
function shareInvoice(){alert('请先点击「导出 PDF / 打印」，在 iPhone 打印预览中打开分享菜单，存储 PDF 后分享到 WhatsApp。')}function voidInvoice(id){if(!confirm('确定作废此 Invoice？编号会保留。'))return;let x=db.invoices.find(y=>y.id===id);x.void=true;save();render()}function historyView(id){let x=db.invoices.find(y=>y.id===id);alert((x.versions||[]).map((y,i)=>`V${i+1} · ${y.archivedAt||y.date} · ${rm(total(y))}`).join('\n')||'目前没有历史版本')}
function rates(){app.innerHTML=`<div class="card"><h2>分类管理</h2><select id="catSel" onchange="rateRows()">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="row" style="margin-top:10px"><button class="small alt" onclick="addCategory()">＋ 分类</button><button class="small alt" onclick="renameCategory()">修改名称</button><button class="small danger" onclick="deleteCategory()">删除分类</button></div></div><div class="card"><h2>新增价格项目</h2>${field('项目名称','r_desc')}${field('Size','r_size')}${field('Unit','r_unit','m')}${field('Rate (RM)','r_rate','0','number')}<button onclick="addRateRow()">保存项目</button></div><div class="card"><h2>价格库</h2><div id="rateRows"></div></div>`;rateRows()}function rateRows(){let c=v('catSel');document.getElementById('rateRows').innerHTML=db.rates.map((x,i)=>({...x,i})).filter(x=>x.category===c).map(x=>`<div class="item row"><div><b>${esc(x.description)}</b><div class="muted">${esc(x.size)} · ${rm(x.rate)}/${esc(x.unit)}</div></div><span><button class="small alt" onclick="editRate(${x.i})">修改</button> <button class="small danger" onclick="delRate(${x.i})">删除</button></span></div>`).join('')||'<p class="muted">暂无项目</p>'}function addCategory(){let n=prompt('新分类名称');if(n?.trim()&&!db.categories.includes(n.trim())){db.categories.push(n.trim());save();rates()}}function renameCategory(){let c=v('catSel'),n=prompt('修改分类名称',c);if(!n?.trim()||n===c)return;db.categories=db.categories.map(x=>x===c?n:x);db.rates.forEach(x=>{if(x.category===c)x.category=n});save();rates()}function deleteCategory(){let c=v('catSel');if(!confirm(`删除 ${c}？该分类的价格项目也会删除，历史 Invoice 不受影响。`))return;db.categories=db.categories.filter(x=>x!==c);db.rates=db.rates.filter(x=>x.category!==c);save();rates()}function addRateRow(){if(!v('r_desc'))return alert('请填写项目名称');db.rates.push({category:v('catSel'),description:v('r_desc'),size:v('r_size'),unit:v('r_unit'),rate:Number(v('r_rate'))||0});save();rates()}function editRate(i){let x=db.rates[i],n=prompt('项目名称',x.description);if(n===null)return;x.description=n;x.size=prompt('Size',x.size)??x.size;x.unit=prompt('Unit',x.unit)??x.unit;x.rate=Number(prompt('Rate (RM)',x.rate)??x.rate);save();rates()}function delRate(i){if(confirm('删除此价格项目？')){db.rates.splice(i,1);save();rates()}}
function customers(){app.innerHTML=`<div class="card"><h2>新增客户</h2>${field('客户 / 公司名称','c_name')}${field('电话','c_phone')}${field('地址','c_address')}<button onclick="addCustomer()">保存客户</button></div>${db.customers.map((x,i)=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.address)}</div></div><span><button class="small alt" onclick="editCustomer(${i})">修改</button> <button class="small danger" onclick="deleteCustomer(${i})">删除</button></span></div>`).join('')}`}function addCustomer(){if(!v('c_name'))return;db.customers.push({name:v('c_name'),phone:v('c_phone'),address:v('c_address')});save();customers()}function editCustomer(i){let x=db.customers[i];x.name=prompt('客户名称',x.name)??x.name;x.phone=prompt('电话',x.phone)??x.phone;x.address=prompt('地址',x.address)??x.address;save();customers()}function deleteCustomer(i){if(confirm('删除客户？')){db.customers.splice(i,1);save();customers()}}
function settings(){let s=db.settings;app.innerHTML=`<div class="card"><h2>公司资料</h2>${field('Company Name','s_company',s.company)}<label>Address</label><textarea id="s_address">${esc(s.address)}</textarea>${field('Contact Number','s_phone',s.phone)}<h2>银行资料</h2>${field('Bank Name','s_bank',s.bank)}${field('Account Number','s_account',s.account)}${field('Account Holder','s_holder',s.holder)}<button onclick="saveSettings()">保存设置</button></div><div class="card"><h2>电子签名</h2><p class="muted">用手指在下方签名，保存后自动显示在新生成的 Invoice PDF 中。</p><canvas id="sign"></canvas><div class="row"><button class="alt" onclick="clearSign()">清除重签</button><button onclick="saveSign()">保存签名</button></div></div><div class="card"><h2>本机资料备份</h2><p class="muted">本机储存可能因清除 Safari 网站数据、卸载或换手机而丢失。请定期导出 JSON 备份。</p><button onclick="backup()">导出备份 JSON</button> <label>导入备份 JSON</label><input type="file" accept="application/json" onchange="restore(event)"></div><div class="card"><b>下一个 Invoice：${nextNo()}</b><p class="muted">永久连续编号，不包含年份。无税务、无付款状态、无 Remarks、无 Registration No.</p></div>`;setupCanvas()}function saveSettings(){for(let k of ['company','address','phone','bank','account','holder'])db.settings[k]=v('s_'+k);save();alert('已保存')}let canvas,ctx,down=false;function setupCanvas(){canvas=document.getElementById('sign');canvas.width=600;canvas.height=180;ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#273348';if(db.settings.signature){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,600,180);im.src=db.settings.signature}const pos=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{down=true;signatureDirty=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};canvas.onpointerup=()=>down=false}function clearSign(){ctx.clearRect(0,0,600,180);signatureDirty=true}function saveSign(){db.settings.signature=canvas.toDataURL('image/png');save();alert('电子签名已保存')}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contractor-invoice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.invoices)||!Array.isArray(d.categories)||!d.settings)throw Error('无效备份');if(confirm('导入会覆盖本机现有资料，继续吗？')){db=d;save();render()}}).catch(()=>alert('备份文件无效'))}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});save();render();
</script></body></html>
